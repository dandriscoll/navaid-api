[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navaid-api"
version = "2.0.0"
description = "REST API for FAA NAVAID and fix coordinates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# starlette's TestClient (loaded via fastapi.testclient) requires httpx2; plain
# httpx is deprecated upstream and on a removal trajectory. Pin httpx2 so a fresh
# install takes the supported path and the suite runs without the deprecation.
dev = ["pytest", "requests", "httpx2>=2.0.0"]

[project.scripts]
navaid-api = "navaid_api.main:run"
navaid-download = "navaid_api.download_data:main"

[tool.hatch.build.targets.wheel]
packages = ["navaid_api"]
